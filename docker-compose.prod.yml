  #     - /usr/src/app/node_modules

  db:
    container_name: gs_wa_agent_psdb
    image: postgres:latest
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    container_name: gs_wa_agent_redis
    image: redis:latest
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - my_network
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

networks:
  my_network:
    driver: bridge
    name: my_network
